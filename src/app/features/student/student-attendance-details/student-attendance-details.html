<main class="attendance-page">

      <section class="todays-updates" aria-labelledby="todays-updates-title">
        <div class="todays-updates__header">
          <h2 id="todays-updates-title">Attendance Details</h2>
          <app-date-picker
            [compact]="true"
            [startDate]="fromDate()"
            (startDateChange)="fromDate.set($event)"
            [endDate]="toDate()"
            (endDateChange)="toDate.set($event)" />
        </div>
      </section>


        <app-dashboard-footer role="student" />

</main>
