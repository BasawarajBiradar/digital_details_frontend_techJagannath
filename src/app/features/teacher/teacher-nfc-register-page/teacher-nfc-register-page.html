<main class="teacher-register">
  <section class="teacher-register__card" aria-labelledby="teacher-register-title">
    <div class="teacher-register__header">
      <mat-icon aria-hidden="true">badge</mat-icon>
      <div><h1 id="teacher-register-title">Teacher registration</h1><p>Create your teacher profile</p></div>
    </div>
    @if (submitted()) {
      <div class="teacher-register__success"><mat-icon>check_circle</mat-icon><h2>You're registered!</h2><p>Redirecting to login...</p></div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>Full name<input formControlName="fullName" type="text" /></label>
        <label>Employee ID<input formControlName="employeeId" type="text" /></label>
        <label>Department<input formControlName="department" type="text" /></label>
        <label>Designation<input formControlName="designation" type="text" /></label>
        <label>Email<input formControlName="emailId" type="email" /></label>
        <label>Contact number<input formControlName="contactNumber" type="tel" /></label>
        <label>Password<div class="teacher-register__password"><input formControlName="password" [type]="showPassword() ? 'text' : 'password'" /><button type="button" aria-label="Toggle password visibility" (click)="showPassword.update(value => !value)"><mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon></button></div></label>
        <label>Confirm password<input formControlName="confirmPassword" [type]="showPassword() ? 'text' : 'password'" /></label>
        <button class="teacher-register__submit" type="submit" [disabled]="loading()">{{ loading() ? 'Registering...' : 'Register' }}</button>
      </form>
    }
  </section>
</main>
