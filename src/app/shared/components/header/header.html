<header class="header">
  <div class="header__inner">
    <div class="header__leading">
      @if (showBackButton()) {
        <button
          type="button"
          class="header__back"
          aria-label="Go back"
          (click)="goBack()">
          <mat-icon aria-hidden="true">arrow_back</mat-icon>
        </button>
      }

      <a class="header__logo" routerLink="/" aria-label="TapAxe Home">
        <div class="header__logo-badge">
          <img class="header__logo-icon" ngSrc="TAPAXE_logo.svg" width="30" height="30" alt="Tapaxe" />
        </div>
        <div class="header__brand-text">
          <span class="header__brand-name">TAPAXE</span>
          <span class="header__brand-tag">PORTAL</span>
        </div>
      </a>
    </div>

    @if (title()) {
      <div class="header__center">
        <h1 class="header__title">{{ title() }}</h1>
      </div>
    }

    <div class="header__trailing">
      <div class="header__status-badge" title="TapAxe School Safety System Online">
        <span class="header__status-dot" aria-hidden="true"></span>
        <span class="header__status-text">Online</span>
      </div>
    </div>
  </div>
</header>
